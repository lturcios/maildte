# Despliegue en VPS (sección 10 de la arquitectura + addendum multi-tenant).
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Requiere un archivo .env junto a este compose (ver RUNBOOK.md y .env.example).

services:
  api:
    build: .
    image: maildte-collector:latest
    # prisma migrate deploy corre SOLO acá (no en el worker): evita que dos
    # procesos disputen el lock de migración al arrancar juntos, y el worker
    # espera a que la api esté healthy (abajo) antes de arrancar él mismo.
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main.js"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/data/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      # Solo loopback: nginx (host) es el único punto de entrada público (sección 10).
      - '127.0.0.1:3000:3000'

  worker:
    build: .
    image: maildte-collector:latest
    command: node dist/worker.js
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Espera a que la api termine migrate deploy y quede healthy: el worker
      # nunca debe arrancar contra un esquema a medio migrar.
      api:
        condition: service_healthy
    volumes:
      - storage:/data/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maildte
      POSTGRES_USER: maildte
      # Mismo criterio que redis: variable obligatoria con ${VAR:?mensaje}. Con
      # ${DB_PASSWORD} pelado, una variable ausente se sustituye por cadena
      # vacía y el fallo aparece recién dentro del contenedor.
      POSTGRES_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD es obligatoria. Definirla en el .env junto a este compose y usar la misma clave en DATABASE_URL.}'
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo loopback: acceso administrativo vía SSH al VPS (scripts de
      # scripts/, pg_dump de scripts/backup.sh), nunca expuesto a internet.
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maildte -d maildte']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Autenticación obligatoria. La sintaxis ${VAR:?mensaje} de Compose aborta
    # el `up` cuando REDIS_PASSWORD no está definida o está vacía: con un
    # ${REDIS_PASSWORD} pelado, Compose sustituiría por cadena vacía y Redis
    # arrancaría sin contraseña con aspecto de estar configurado. La misma clave
    # tiene que ir en REDIS_URL (redis://:CLAVE@redis:6379); la aplicación no
    # lee REDIS_PASSWORD, solo REDIS_URL.
    command:
      - 'redis-server'
      - '--requirepass'
      - '${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria. Definirla en el .env junto a este compose y usar la misma clave en REDIS_URL (redis://:CLAVE@redis:6379).}'
    environment:
      # redis-cli toma REDISCLI_AUTH del entorno. La usa el healthcheck de abajo
      # para no llevar la clave en su propia línea de comandos, que se ejecuta
      # cada 5 s y haría que redis-cli imprima el aviso de `-a`/`-u` en el log
      # de salud. También la aprovechan los `docker compose exec redis
      # redis-cli ...` del RUNBOOK, que así no piden credenciales a mano.
      REDISCLI_AUTH: '${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria. Definirla en el .env junto a este compose y usar la misma clave en REDIS_URL (redis://:CLAVE@redis:6379).}'
    volumes:
      - redisdata:/data
    ports:
      # Solo loopback, mismo criterio que postgres (ambos exigen contraseña y
      # ninguno sale del host): los scripts de mantenimiento corren en el host
      # (la imagen no trae ts-node) y el backfill del libro de compras necesita
      # encolar en esta cola. 6380 y no 6379 por si el VPS ya tiene un Redis
      # nativo escuchando. Nunca expuesto a internet.
      - '127.0.0.1:6380:6379'
    healthcheck:
      # Con requirepass, un `redis-cli ping` sin credenciales responde NOAUTH.
      # Se exige el PONG literal en vez de confiar en el código de salida:
      # redis-cli puede terminar en 0 imprimiendo el error, y un healthcheck
      # que se conforma con eso daría por sano un Redis que rechaza a todos.
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  pgdata:
  redisdata:
