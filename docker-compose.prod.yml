# Despliegue en VPS (sección 10 de la arquitectura + addendum multi-tenant).
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Requiere un archivo .env junto a este compose (ver RUNBOOK.md y .env.example).

services:
  api:
    build: .
    image: maildte-collector:latest
    # prisma migrate deploy corre SOLO acá (no en el worker): evita que dos
    # procesos disputen el lock de migración al arrancar juntos, y el worker
    # espera a que la api esté healthy (abajo) antes de arrancar él mismo.
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main.js"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/data/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      # Solo loopback: nginx (host) es el único punto de entrada público (sección 10).
      - '127.0.0.1:3000:3000'

  worker:
    build: .
    image: maildte-collector:latest
    command: node dist/worker.js
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Espera a que la api termine migrate deploy y quede healthy: el worker
      # nunca debe arrancar contra un esquema a medio migrar.
      api:
        condition: service_healthy
    volumes:
      - storage:/data/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maildte
      POSTGRES_USER: maildte
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo loopback: acceso administrativo vía SSH al VPS (scripts de
      # scripts/, pg_dump de scripts/backup.sh), nunca expuesto a internet.
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maildte -d maildte']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  pgdata:
  redisdata:
