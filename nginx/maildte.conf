# Nginx del HOST (no containerizado) — proxy a la api en 127.0.0.1:3000
# (publicado por docker-compose.prod.yml solo en loopback). TLS gestionado
# por Certbot (certbot --nginx), como el resto del ecosistema LTSOFT.
#
# Instalación: copiar a /etc/nginx/sites-available/maildte.conf, symlink en
# sites-enabled/, reemplazar DOMINIO por el real, `nginx -t && systemctl
# reload nginx`, y correr `certbot --nginx -d DOMINIO` (ver RUNBOOK.md).

# Redirección HTTP -> HTTPS + endpoint del challenge ACME de Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMINIO;

    # Certbot reescribe estas dos líneas (ssl_certificate / ssl_certificate_key)
    # la primera vez que corre `certbot --nginx`; no hace falta tocarlas a mano.
    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # La API valida su propio body (1 MB por request, skill api-conventions —
    # no recibe archivos por HTTP, los adjuntos entran por IMAP). 30m es un
    # techo defensivo del ecosistema LTSOFT, no el tamaño esperado real.
    client_max_body_size 30m;

    access_log /var/log/nginx/maildte.access.log;
    error_log  /var/log/nginx/maildte.error.log;

    # Panel web (React SPA), build estático publicado en /var/www/maildte-panel
    # (ver RUNBOOK.md sección 1, paso 5). Los assets con hash en el nombre
    # (JS/CSS de Vite) cachean agresivo; index.html nunca, para que un deploy
    # nuevo se vea sin purgar caché del navegador.
    location /panel/assets/ {
        alias /var/www/maildte-panel/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /panel/ {
        alias /var/www/maildte-panel/;
        try_files $uri $uri/ /panel/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /export/archive y /attachments/:id/download son streams
        # potencialmente largos: sin buffering para no acumular el ZIP/archivo
        # completo en memoria de nginx antes de mandarlo al cliente.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
