services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maildte
      POSTGRES_USER: maildte
      POSTGRES_PASSWORD: secret
    ports:
      - '5433:5432' # 5432 puede estar ocupado por un Postgres nativo del host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maildte -d maildte']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Desarrollo local sin contraseña, a diferencia de producción, donde
    # `docker-compose.prod.yml` arranca Redis con `--requirepass` y aborta el
    # `up` si falta REDIS_PASSWORD. Acá no la pedimos porque este compose no
    # sale de la máquina del desarrollador y exigirla obligaría a actualizar el
    # `.env` y el `REDIS_URL` de `test/set-test-env.ts` de todo el equipo.
    # No copiar este `REDIS_URL` (`redis://localhost:6379`) a un `.env` de
    # producción: allá la forma correcta es `redis://:CLAVE@redis:6379`.
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
